services:
  - type: web
    name: adaptivepromptguard
    env: python
    pythonVersion: "3.11.9"
    rootDir: ui
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: HF_MODEL_REPO
        value: rockanks/apg-classifier
      - key: HF_TOKEN
        sync: false        # set this manually in Render dashboard
      - key: THRESHOLD
        value: "0.5"
